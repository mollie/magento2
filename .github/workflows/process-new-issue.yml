name: Process new issue

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to reformat'
        required: true
        type: number

permissions:
  issues: write

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: 'Step 1: Reformat issue body'
        uses: actions/github-script@v8
        env:
          INPUT_ISSUE_NUMBER: ${{ inputs.issue_number }}
        with:
          script: |
            let issue;
            if (context.eventName === 'workflow_dispatch') {
              const { data } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: Number(process.env.INPUT_ISSUE_NUMBER),
              });
              issue = data;
            } else {
              issue = context.payload.issue;
            }

            const originalBody = issue.body;
            if (!originalBody) return;

            // Keep an existing Jira footer so a manual reformat does not remove it
            const jiraFooterRegex = /\n*---\n+🎫 Jira ticket created:.*$/s;
            const jiraFooter = originalBody.match(jiraFooterRegex)?.[0] ?? '';
            const body = originalBody.replace(jiraFooterRegex, '');

            // Only format issues created from the bug report template
            // by checking for sections unique to that template
            const isBugReport = body.includes('### Mollie plugin version') &&
                                body.includes('### Steps to reproduce');
            if (!isBugReport) {
              console.log('Skipping: issue was not created from the bug report template');
              return;
            }

            // Parse sections from the GitHub issue form output
            // Format: ### Label\n\nValue\n\n
            const sections = {};
            const sectionRegex = /### (.+?)\n\n([\s\S]*?)(?=\n### |\n*$)/g;
            let match;
            while ((match = sectionRegex.exec(body)) !== null) {
              sections[match[1].trim()] = match[2].trim();
            }

            // Version/environment fields to put in a table
            const tableFields = [
              'Mollie plugin version',
              'Magento edition',
              'Magento version',
              'PHP version',
              'Frontend theme base',
              'Hyva Theme version',
              'Hyva Checkout version',
            ];

            // Build the version table, skip empty fields
            let table = '| **Type** | **Version** |\n';
            table += '|---|---|\n';
            for (const field of tableFields) {
              const value = sections[field];
              if (value && value !== '_No response_') {
                table += `| **${field}** | ${value} |\n`;
              }
            }

            // Fields that should be collapsible
            const collapsibleFields = [
              'Payment method (if applicable)'
            ];

            // Fields to render as regular sections (in order)
            const regularFields = [
              'Summary',
              'Payment method (if applicable)',
              'Store integrations & background processes',
              'Integration details',
              'Steps to reproduce',
              'Expected behavior',
              'Actual behavior',
              'Relevant log output',
              'Screenshots',
              'Additional context',
            ];

            let newBody = table + '\n';

            for (const field of regularFields) {
              const value = sections[field];
              if (value && value !== '_No response_') {
                if (collapsibleFields.includes(field)) {
                  newBody += `<details>\n<summary><strong>${field}</strong></summary>\n\n${value}\n\n</details>\n\n`;
                } else {
                  newBody += `### ${field}\n\n${value}\n\n`;
                }
              }
            }

            newBody = newBody.trim() + jiraFooter;

            // Only update if the body actually changed
            if (newBody !== originalBody.trim()) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: newBody,
              });
            }

      - name: 'Step 2: Determine Jira issue type'
        id: type
        if: github.event_name == 'issues'
        run: |
          LABELS='${{ toJson(github.event.issue.labels.*.name) }}'
          if echo "$LABELS" | grep -qi "bug"; then
            echo "ISSUE_TYPE=Bug" >> $GITHUB_OUTPUT
          elif echo "$LABELS" | grep -qi "enhancement\|feature"; then
            echo "ISSUE_TYPE=New Feature" >> $GITHUB_OUTPUT
          else
            echo "ISSUE_TYPE=Ticket" >> $GITHUB_OUTPUT
          fi

      - name: 'Step 3: Check for an existing Jira ticket'
        id: guard
        if: github.event_name == 'issues'
        uses: actions/github-script@v8
        with:
          script: |
            // Read the current labels from the API, because a re-run
            // receives the labels from the moment the issue was opened
            const { data: labels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const hasJiraTicket = labels.some((label) => label.name === 'jira-created');
            if (hasJiraTicket) {
              console.log('Skipping Jira steps: the issue already has the jira-created label');
            }
            core.setOutput('HAS_JIRA', hasJiraTicket ? 'true' : 'false');

      - name: 'Step 4: Create Jira ticket'
        id: create
        if: github.event_name == 'issues' && steps.guard.outputs.HAS_JIRA == 'false'
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          JSON=$(jq -n \
            --arg title "$ISSUE_TITLE" \
            --arg url "$ISSUE_URL" \
            --arg body "$ISSUE_BODY" \
            --arg type "${{ steps.type.outputs.ISSUE_TYPE }}" \
            '{
              fields: {
                project: {key: "PIMAG"},
                summary: $title,
                description: {
                  type: "doc",
                  version: 1,
                  content: [{
                    type: "paragraph",
                    content: [{
                      type: "text",
                      text: ("GitHub Issue: " + $url + "\n\n" + $body)
                    }]
                  }]
                },
                issuetype: {name: $type},
                assignee: {accountId: "5a15453b9b3ce10ed7593192"},
                labels: ["github-issue", "magento2"]
              },
              transition: {id: "21"}
            }')

          RESPONSE=$(curl -s \
            -u "${{ secrets.JIRA_USERNAME }}:${{ secrets.JIRA_API_TOKEN }}" \
            -X POST \
            -H "Content-Type: application/json" \
            -d "$JSON" \
            "https://api.atlassian.com/ex/jira/c6d7ab52-daef-4ab7-9923-177bbb70dbc8/rest/api/3/issue")

          echo "API Response: $RESPONSE"
          JIRA_KEY=$(echo $RESPONSE | python3 -c 'import sys,json; print(json.load(sys.stdin).get("key",""))' 2>/dev/null || echo "")
          echo "JIRA_KEY=$JIRA_KEY" >> $GITHUB_OUTPUT

      - name: 'Step 5: Append Jira link to GitHub issue'
        if: github.event_name == 'issues' && steps.create.outputs.JIRA_KEY != ''
        uses: actions/github-script@v8
        env:
          JIRA_KEY: ${{ steps.create.outputs.JIRA_KEY }}
        with:
          script: |
            const { JIRA_KEY } = process.env;

            // Fetch the current body so the formatted version from step 1 is kept
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const jiraNote = `\n\n---\n\n🎫 Jira ticket created: [${JIRA_KEY}](https://mollie.atlassian.net/browse/${JIRA_KEY})`;
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: (issue.body || '') + jiraNote
            });
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['jira-created']
            });
